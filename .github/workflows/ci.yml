name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências leves (testes não usam torch/tensorflow)
        run: pip install pandas numpy scikit-learn matplotlib pytest ruff
      - name: Lint
        run: ruff check .
      - name: Testes
        run: pytest -q
